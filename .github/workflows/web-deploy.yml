# Builds the web bundle and deploys it to Firebase Hosting on every push to main.
# Handoff: this only runs once the repository has these Actions secrets set —
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_APP_ID, VITE_FIREBASE_MESSAGING_SENDER_ID,
#   VITE_FIREBASE_STORAGE_BUCKET  (the public web config — safe to ship to clients)
#   FIREBASE_SERVICE_ACCOUNT      (a Hosting-deploy service-account JSON key)
# The desktop-only VITE_GOOGLE_DESKTOP_CLIENT_ID/SECRET are deliberately NOT passed
# here — they belong to the Tauri loopback-OAuth flow and must never enter the web build.
name: Deploy web (Firebase Hosting)

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: web-deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        run: npm run build

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        # This action has no Node-24 release yet (latest tag v0.10.0 still declares
        # runs.using: node20), so force the runner to execute it on Node 24. Without
        # this it breaks after GitHub drops Node 20 from the runners (forced switch
        # 2026-06-16). Safe to remove once a node24 release ships and @v0 adopts it —
        # the flag only upgrades node20 actions, so it's a no-op against node24 ones.
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
