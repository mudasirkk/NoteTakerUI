[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# Desktop Google sign-in: loopback OAuth + PKCE token exchange. native-tls keeps
# us on Windows SChannel (no ring/rustls build toolchain needed). ureq's native-tls
# backend is NOT auto-wired by the feature flag — the bare ureq::post helper has no
# TLS connector and fails at runtime ("no TLS backend is configured"), so we build
# the connector explicitly with the native-tls crate (see run_google_oauth).
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
urlencoding = "2"
open = "5"
# Unzip the downloaded ffmpeg build (Windows) to pull out ffmpeg.exe/ffprobe.exe.
# gyan.dev's archives are standard Deflate, so we only need that codec.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# Persists window size/position/maximized across launches (UX-4).
tauri-plugin-window-state = "2"
